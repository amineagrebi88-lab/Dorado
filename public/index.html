<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Boutique - Accueil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo">TechStore</a>
    <div>
      <a href="index.html">Boutique</a>
      <a href="panier.html" class="cart-btn">Panier (<span id="cart-count">0</span>)</a>
    </div>
  </nav>

  <main>
    <h1>Nos Produits</h1>
    <div id="products-list" class="grid"></div>
  </main>

  <script src="main.js"></script>
  <script>
    async function loadCatalog() {
      const res = await fetch('/api/products');
      const products = await res.json();
      
      const container = document.getElementById('products-list');
      container.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">${p.price.toFixed(2)} €</p>
          <a href="produit.html?id=${p.id}" class="btn-secondary">Voir le produit</a>
        </div>
      `).join('');
    }
    loadCatalog();
  </script>
</body>
</html>
