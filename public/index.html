<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Tech Express</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Boutique Tech Express</h1>
    <div id="cart-summary">Panier : <span id="cart-count">0</span> article(s)</div>
  </header>

  <main>
    <section>
      <h2>Nos Produits</h2>
      <div id="products-list" class="grid"></div>
    </section>

    <section id="cart-section">
      <h2>Votre Panier</h2>
      <ul id="cart-items"></ul>
      <p>Total : <strong id="cart-total">0.00 €</strong></p>
      <button id="checkout-btn" disabled>Passer la commande</button>
      <div id="order-result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
